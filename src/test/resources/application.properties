spring.application.name=mistry-test

# In-memory database for tests (no XAMPP needed)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Fake secrets, only for tests
jwt.secret=abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789ab
jwt.expiration-ms=86400000
admin.registration.secret-key=test-admin-key

platform.cancellation.min-window-hours=12
platform.cancellation.min-refund-percent=25